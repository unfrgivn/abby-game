name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate repo structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required documentation
        run: |
          echo "Checking required documentation..."
          test -f "spec.md" && echo "✓ spec.md found" || (echo "✗ spec.md missing" && exit 1)
          test -f "AGENTS.md" && echo "✓ AGENTS.md found" || (echo "✗ AGENTS.md missing" && exit 1)
          test -f "docs/setup.md" && echo "✓ docs/setup.md found" || (echo "✗ docs/setup.md missing" && exit 1)

      - name: Check scripts are present
        run: |
          test -f "scripts/godot_test.sh" && echo "✓ scripts/godot_test.sh found" || (echo "✗ scripts/godot_test.sh missing" && exit 1)
          test -f "scripts/godot_export.sh" && echo "✓ scripts/godot_export.sh found" || (echo "✗ scripts/godot_export.sh missing" && exit 1)

      - name: Check Godot project (optional)
        run: |
          if [[ -f "GodotProject/project.godot" ]]; then
            echo "✓ Godot project found at GodotProject/project.godot"
          else
            echo "(Info) GodotProject/project.godot not found yet — skipping engine-level checks"
          fi
