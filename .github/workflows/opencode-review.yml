name: OpenCode PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "GodotProject/**/*.gd"
      - "GodotProject/**/*.tscn"
      - "GodotProject/**/*.tres"
      - "GodotProject/**/*.res"
      - "GodotProject/**/*.gdshader"
      - "docs/**/*.md"
      - "scripts/**/*.sh"

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          model: google/gemini-3-flash-preview
          prompt: |
            Please review this pull request following the guidelines in AGENTS.md.

            ## Review Focus:
            - Godot patterns (scene composition, small node scripts, signals)
            - Separation of concerns (UI vs gameplay rules, data Resources vs runtime nodes)
            - Potential bugs or soft-lock risks (scene transitions, save/load integrity)
            - Mobile-first UX and performance considerations
            - Alignment with spec.md goals (turn-based Sticker battles, lantern/journal loop)

            ## Merge Policy (from AGENTS.md):
            Only block for serious problems:
            - Failing tests or broken build
            - Breaking changes to player flow, save model, or public APIs
            - Behavior contradicts spec.md or introduces unplanned scope
            - Crash, data loss, security issue, or major performance regression
            - New third-party dependency without approval

            For non-blocking feedback, suggest creating follow-up GitHub Issues.
