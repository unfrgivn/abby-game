name: OpenCode PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "UnityProject/**/*.cs"
      - "docs/**/*.md"
      - "scripts/**/*.sh"

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          model: google/gemini-3-flash-preview
          prompt: |
            Please review this pull request following the guidelines in AGENTS.md:

            ## Review Focus:
            - Code quality and C# best practices (PascalCase types/public, camelCase locals/private)
            - Unity patterns (composition over inheritance, small MonoBehaviours)
            - Potential bugs or issues
            - Test coverage (EditMode for pure logic, PlayMode for scene-dependent)
            - Alignment with spec.md goals

            ## Merge Policy (from AGENTS.md):
            Only block for serious problems:
            - Failing tests or broken build
            - Breaking changes to player flow, save model, or public APIs
            - Behavior contradicts spec.md or introduces unplanned scope
            - Crash, data loss, security issue, or major performance regression
            - New third-party dependency without approval

            For non-blocking feedback, suggest creating follow-up GitHub Issues.
